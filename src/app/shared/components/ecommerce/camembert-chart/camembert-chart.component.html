<div class="rounded-3xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]">
  <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90 mb-6 flex items-center gap-2">
    Répartition par niveau de logs
    <span class="text-xs bg-gray-100 dark:bg-gray-800 px-2.5 py-1 rounded-full font-medium">
      {{ stats?.totalLogs | number }} logs
    </span>
  </h3>

  <div *ngIf="chartOptions; else noData">
    <apx-chart
      [series]="chartOptions.series"
      [chart]="chartOptions.chart"
      [labels]="chartOptions.labels"
      [colors]="chartOptions.colors"
      [legend]="chartOptions.legend"
      [dataLabels]="chartOptions.dataLabels"
      [plotOptions]="chartOptions.plotOptions"
      [tooltip]="chartOptions.tooltip"
      [responsive]="chartOptions.responsive">
    </apx-chart>
  </div>

  <ng-template #noData>
    <div class="flex flex-col items-center justify-center py-16 text-gray-400 dark:text-gray-600">
      <span class="text-5xl mb-4">📊</span>
      <p class="text-sm">Aucune donnée disponible pour le moment</p>
    </div>
  </ng-template>
</div>
