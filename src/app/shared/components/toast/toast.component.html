<div class="absolute top-6 right-6 z-[9999]">
    @for (toast of toastService.toasts$ | async; track toast.id) {
    <div
      class="rounded-xl shadow-2xl p-4 flex gap-3 border-l-6 animate-slide-in pointer-events-auto"
      [ngClass]="{
        'bg-red-50 border-red-600 text-red-900': toast.type === 'error',
        'bg-yellow-50 border-yellow-600 text-yellow-900': toast.type === 'warning',
        'bg-green-50 border-green-600 text-green-900': toast.type === 'success',
        'bg-blue-50 border-blue-600 text-blue-900': toast.type === 'info'
      }">

      <!-- Icon -->
      <div class="flex-shrink-0 mt-0.5">
        @if (toast.type === 'error') {
          <span class="text-red-600 text-2xl">⚠️</span>
        } @else if (toast.type === 'warning') {
          <span class="text-yellow-600 text-2xl">⚠️</span>
        } @else if (toast.type === 'info') {
          <span class="text-green-600 text-2xl">✅</span>
        } @else {
          <span class="text-blue-600 text-2xl">ℹ️</span>
        }
      </div>

      <!-- Content -->
      <div class="flex-1 min-w-0">
        <h4 class="font-semibold text-base leading-tight">{{ toast.title }}</h4>
        <p class="text-sm mt-1 text-gray-700">{{ toast.message }}</p>
      </div>

      <!-- Close button -->
      <button 
        (click)="remove(toast.id)"
        class="text-gray-400 hover:text-gray-600 text-3xl leading-none -mt-2 -mr-1">
        ×
      </button>
    </div>
  }
</div>
